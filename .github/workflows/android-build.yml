name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            gradle-task: assembleDebug
            gradle-flags: -PreactNativeArchitectures=arm64-v8a
            apk-path: android/app/build/outputs/apk/debug/app-debug.apk
            artifact-name: app-debug
          - variant: release
            gradle-task: assembleRelease
            gradle-flags: ""
            apk-path: android/app/build/outputs/apk/release/app-release.apk
            artifact-name: app-release
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
          tool-cache: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store-path=$(nix develop -c pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Decode release keystore
        id: decode-keystore
        if: matrix.variant == 'release' && env.RELEASE_KEYSTORE_BASE64 != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
        run: |
          if echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore 2>/dev/null && \
             keytool -list \
               -keystore android/app/release.keystore \
               -storepass "$RELEASE_STORE_PASSWORD" \
               -alias "$RELEASE_KEY_ALIAS" > /dev/null 2>&1; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Release keystore verification failed"
            rm -f android/app/release.keystore
          fi

      - name: Require valid release signing
        if: matrix.variant == 'release' && github.event_name != 'pull_request' && steps.decode-keystore.outputs.verified != 'true'
        run: |
          echo "::error::Release signing credentials are missing or invalid"
          exit 1

      - name: Require Google Sign-In configuration
        if: matrix.variant == 'release' && github.event_name != 'pull_request' && steps.decode-keystore.outputs.verified == 'true'
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID is required for release builds"
            exit 1
          fi
          printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" > .env.release

      - name: Build APK
        id: build
        if: matrix.variant == 'debug' || (github.event_name != 'pull_request' && steps.decode-keystore.outputs.verified == 'true')
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ENVFILE: ${{ matrix.variant == 'release' && '.env.release' || '.env' }}
        run: nix develop -c bash -c 'cd android && ./gradlew ${{ matrix.gradle-task }} ${{ matrix.gradle-flags }}'

      - name: Verify release APK signature
        if: matrix.variant == 'release' && steps.build.outcome == 'success'
        run: apksigner verify --verbose --print-certs "${{ matrix.apk-path }}"

      - name: Upload APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.apk-path }}
          retention-days: 7

  test:
    name: Android Lint, Instrumentation & Detox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store-path=$(nix develop -c pnpm store path | tail -n 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store-path }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install dependencies
        run: nix develop -c pnpm install --frozen-lockfile

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Lint Android app
        run: nix develop -c bash -lc "cd android && ./gradlew :app:lintDebug"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 36
          arch: x86_64
          script: nix develop -c bash -lc "pnpm android:test && pnpm e2e:build:attached && pnpm e2e:test:attached"
