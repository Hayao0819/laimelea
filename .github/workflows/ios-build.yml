name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build iOS (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98

      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Verify bundled icon font
        run: test "$(/usr/libexec/PlistBuddy -c 'Print :UIAppFonts:0' ios/Laimelea/Info.plist)" = "MaterialDesignIcons.ttf"

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -workspace ios/Laimelea.xcworkspace \
            -scheme Laimelea \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Archive simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Laimelea.app" -path "*/Build/Products/Debug-iphonesimulator/*" | head -1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$RUNNER_TEMP/Laimelea-simulator.zip" Laimelea.app
          else
            echo "::warning::Could not find .app bundle for archiving"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Laimelea-ios-simulator
          path: ${{ runner.temp }}/Laimelea-simulator.zip
          retention-days: 7
          if-no-files-found: warn
