name: Update Flake Inputs

on:
  schedule:
    # Monday 09:00 JST (= Monday 00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      inputs:
        description: "Space-separated list of inputs to update (leave empty for all)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - uses: DeterminateSystems/update-flake-lock@0281a39e4c38fabb75c9d1377e541666db300909
        with:
          inputs: ${{ github.event.inputs.inputs }}
          pr-title: "chore: update flake inputs"
          pr-labels: |
            dependencies
            automated
          commit-msg: "chore: update flake.lock"
