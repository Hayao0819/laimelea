apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def releaseSigningEnvironment = [
    RELEASE_KEYSTORE_FILE: System.getenv('RELEASE_KEYSTORE_FILE'),
    RELEASE_STORE_PASSWORD: System.getenv('RELEASE_STORE_PASSWORD'),
    RELEASE_KEY_ALIAS: System.getenv('RELEASE_KEY_ALIAS'),
    RELEASE_KEY_PASSWORD: System.getenv('RELEASE_KEY_PASSWORD'),
]
def missingReleaseSigningEnvironment = releaseSigningEnvironment.findAll { key, value ->
    value == null || value.trim().isEmpty()
}.keySet()

def validateReleaseSigning = tasks.register('validateReleaseSigning') {
    doLast {
        if (!missingReleaseSigningEnvironment.isEmpty()) {
            throw new GradleException(
                "Release signing requires: ${missingReleaseSigningEnvironment.join(', ')}",
            )
        }
        if (!file(releaseSigningEnvironment.RELEASE_KEYSTORE_FILE).isFile()) {
            throw new GradleException('RELEASE_KEYSTORE_FILE must point to an existing keystore file')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn(validateReleaseSigning)
    }
}

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.0.1'

android {
    ndkVersion = rootProject.ext.ndkVersion
    buildToolsVersion = rootProject.ext.buildToolsVersion
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    namespace = "com.hayao0819.laimelea"
    defaultConfig {
        applicationId = "com.hayao0819.laimelea"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = 1
        versionName = "0.1.0"
        def oauthClientId = project.env.get("GOOGLE_OAUTH_CLIENT_ID") ?: ""
        def oauthClientGuid = oauthClientId.replace(".apps.googleusercontent.com", "")
        manifestPlaceholders = [appAuthRedirectScheme: "com.googleusercontent.apps." + oauthClientGuid]
        testBuildType = System.getProperty('testBuildType', 'debug')
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/LICENSE-notice.md']
        }
    }
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
        release {
            if (missingReleaseSigningEnvironment.isEmpty()) {
                storeFile = file(releaseSigningEnvironment.RELEASE_KEYSTORE_FILE)
                storePassword = releaseSigningEnvironment.RELEASE_STORE_PASSWORD
                keyAlias = releaseSigningEnvironment.RELEASE_KEY_ALIAS
                keyPassword = releaseSigningEnvironment.RELEASE_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.core:core-splashscreen:1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    androidTestImplementation('com.wix:detox:20.51.4')
    androidTestImplementation('junit:junit:4.13.2')
    androidTestImplementation('androidx.test:core:1.6.1')
    androidTestImplementation('androidx.test:runner:1.6.2')
    androidTestImplementation('androidx.test.ext:junit:1.2.1')
    androidTestImplementation('io.mockk:mockk-android:1.14.2')
}
